[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kvguard"
version = "0.1.0"
description = "Intelligent Key-Value (KV) Cache Control Plane for LLM Inference Engines"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "KVGuard Team", email = "engineering@kvguard.dev" }
]
keywords = ["llm", "kv-cache", "vllm", "sglang", "tensorrt-llm", "inference", "gpu-memory", "control-plane"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "redis>=5.0.3",
    "click>=8.1.7",
    "rich>=13.7.1",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]
simulation = [
    "numpy>=1.26.0",
]
telemetry = [
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
]
all = [
    "kvguard[dev,simulation,telemetry]",
]

[project.scripts]
kvguard = "kvguard.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["kvguard*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
